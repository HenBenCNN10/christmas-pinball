<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08271f">
<title>Christmas Pinball — By Henry :)</title>
<style>
:root{color-scheme:dark;--gold:#ffdf75;--red:#e7444f;--green:#42c87b;--ice:#e7fbff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:12px;background:radial-gradient(ellipse at 50% 0,#276247,#0b2926 48%,#07151f);color:#f4fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center}.shell{width:min(100%,720px);text-align:center}header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 2px 10px}h1{font-size:clamp(1.25rem,5vw,2rem);margin:0;color:var(--gold);text-shadow:0 2px 15px #f3983c88}.credit{font-size:.8rem;color:#c5f3d5}.stats{display:flex;gap:6px}.stat{min-width:58px;padding:5px 7px;border:1px solid #fff4;border-radius:10px;background:#061b1acc;font-size:.63rem;text-transform:uppercase;color:#bcebd0}.stat b{display:block;color:var(--gold);font-size:1.05rem}.cabinet{padding:8px;border:3px ridge #e9c66e;border-radius:20px;background:linear-gradient(135deg,#bd2938,#117344 35%,#092a26 70%,#bd2938);box-shadow:0 16px 45px #000b,inset 0 0 18px #ffdf7544}canvas{display:block;width:100%;height:auto;max-height:72vh;aspect-ratio:9/10;object-fit:contain;background:#08251d;border-radius:11px;touch-action:none}.controls,.flipper-controls{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px}button{font:700 .9rem system-ui,sans-serif;color:#09241c;background:linear-gradient(#fff0a8,#f2bd43);border:0;border-radius:11px;padding:10px 15px;box-shadow:0 4px 0 #9c5e1b;cursor:pointer;touch-action:none;user-select:none}button.secondary{background:linear-gradient(#e9fbff,#a6d9e8);box-shadow:0 4px 0 #548b9b}.flipper-controls{justify-content:space-between}.flipper-controls button{width:46%;min-height:56px;background:linear-gradient(#f87b73,#c72c3a);color:white;box-shadow:0 4px 0 #771725}.help{margin:11px 2px 0;color:#d4ede6;font-size:.83rem;line-height:1.45}.help strong{color:var(--gold)}@media(min-width:720px){.shell{width:min(100%,660px)}.flipper-controls{display:none}}
</style>
</head>
<body><main class="shell">
<header><div style="text-align:left"><h1>🎄 Christmas Pinball</h1><div class="credit">By Henry :)</div></div><div class="stats"><div class="stat">Score<b id="score">0</b></div><div class="stat">Balls left<b id="lives">3</b></div><div class="stat">In play<b id="inPlay">0</b></div><div class="stat">Best<b id="best">0</b></div></div></header>
<section class="cabinet"><canvas id="game" width="900" height="1000" aria-label="Christmas pinball game"></canvas></section>
<div class="controls"><button id="start">▶ Start game</button><button id="launch" class="secondary">⤴ Hold to launch</button><button id="sound" class="secondary">🔊 Sound on</button></div>
<div class="flipper-controls"><button id="left">◀ LEFT FLIPPER</button><button id="right">RIGHT FLIPPER ▶</button></div>
<p class="help"><strong>Play:</strong> ← / A and → / D to flip · hold/release Space to launch · R for a new game. Phone: hold the flipper buttons and hold/release Launch. Send the ball through the glowing loop 3 times to start multiball!</p>
</main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),bestEl=document.querySelector('#best'),inPlayEl=document.querySelector('#inPlay');
const startBtn=document.querySelector('#start'),launchBtn=document.querySelector('#launch'),soundBtn=document.querySelector('#sound');
const W=900,H=1000,keys={left:false,right:false,plunger:false};
let score=0,lives=3,best=0,state='title',muted=false,audio=null,charge=0,tick=0,shake=0,loops=0,multiballAwarded=false,flash=0;
try{best=Number(localStorage.getItem('xmasPinballBest'))||0}catch(_){}bestEl.textContent=best;
let balls=[];
const bumpers=[{x:285,y:220,r:32,c:'#e7444f',p:100,cool:0},{x:450,y:190,r:34,c:'#ffcf4a',p:150,cool:0},{x:615,y:220,r:32,c:'#42c87b',p:100,cool:0},{x:250,y:400,r:29,c:'#ffcf4a',p:125,cool:0},{x:650,y:400,r:29,c:'#e7444f',p:125,cool:0}];
// Independent pivots and short tips leave a visible center drain gap.
const flippers={left:{x:318,y:830,len:112,angle:-.08,pressed:false},right:{x:582,y:830,len:112,angle:Math.PI+.08,pressed:false}};
// Bottom guide rails slope toward the flippers, so a draining ball is steered inward instead of resting on a flat ledge.
const rails=[[85,75,85,900],[815,75,815,900],[85,75,815,75],[85,610,165,680],[165,680,255,730],[815,610,735,680],[735,680,645,730],[85,730,250,825],[815,730,650,825],[745,275,745,790],[85,900,270,955],[630,955,815,900]];
const slings=[[115,610,210,710],[785,610,690,710]];
const snow=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.5,s:.5+Math.random()*1.8,p:Math.random()*7}));
function tone(freq=400,dur=.08,type='sine',vol=.03){if(muted)return;try{audio ||= new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(_){}}
function hud(){scoreEl.textContent=score;livesEl.textContent=lives;inPlayEl.textContent=balls.filter(b=>b.active).length;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('xmasPinballBest',best)}catch(_){}}}
function makeBall(x=780,y=850,active=false){return{x,y,r:12,vx:0,vy:0,active,trail:[],cool:0,looping:false,loopT:0,loopCooldown:0,lane:false}}
function serve(){balls=[makeBall()];charge=0;state='ready';startBtn.textContent='↻ New game';hud()}
function newGame(){score=0;lives=3;loops=0;multiballAwarded=false;bumpers.forEach(b=>b.cool=0);hud();serve();tone(660,.1)}
function launch(){if(state==='title'||state==='over')newGame();if(state!=='ready')return;const b=balls.find(x=>!x.active);if(!b)return;b.active=true;b.lane=true;b.vx=-.4;b.vy=-15-Math.min(charge,48)*.14;state='playing';charge=0;tone(220,.15,'triangle',.05)}
function award(n){score+=n;hud()}
function hitSegment(b,x1,y1,x2,y2,restitution=.78,thickness=0){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;if(!l2)return false;const t=Math.max(0,Math.min(1,((b.x-x1)*dx+(b.y-y1)*dy)/l2)),px=x1+t*dx,py=y1+t*dy,nx=b.x-px,ny=b.y-py,d=Math.hypot(nx,ny),reach=b.r+thickness;if(d>=reach||d<.001)return false;const ux=nx/d,uy=ny/d;b.x=px+ux*(reach+.5);b.y=py+uy*(reach+.5);const vn=b.vx*ux+b.vy*uy;if(vn<0){b.vx-=(1+restitution)*vn*ux;b.vy-=(1+restitution)*vn*uy}return true}
function flipperHit(b,f,side){const ex=f.x+Math.cos(f.angle)*f.len,ey=f.y+Math.sin(f.angle)*f.len;if(hitSegment(b,f.x,f.y,ex,ey,.35,7)){if(f.pressed){b.vy=Math.min(b.vy,-10.5);b.vx+=(side==='left'?2.8:-2.8)+(b.x-f.x)*.018;award(10)}if(b.cool<=0){b.cool=5;tone(300,.035,'square',.012)}}}
function bumperHit(b){for(const p of bumpers){const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),min=b.r+p.r;if(d>=min||d<.001)continue;const nx=dx/d,ny=dy/d;b.x=p.x+nx*(min+.6);b.y=p.y+ny*(min+.6);const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.9*vn*nx;b.vy-=1.9*vn*ny}b.vx+=nx*1.2;b.vy+=ny*1.2;if(p.cool<=0){award(p.p);p.cool=14;shake=4;tone(520+Math.random()*260,.09,'sine',.04)}}}
function startLoop(b){b.looping=true;b.loopT=0;b.vx=b.vy=0;b.trail=[];tone(540,.1,'triangle',.035)}
function finishLoop(b){b.looping=false;b.x=450;b.y=620;b.vx=(Math.random()-.5)*2;b.vy=9;b.loopCooldown=110;loops++;award(500);tone(880,.2,'triangle',.04);if(loops>=3&&!multiballAwarded){multiballAwarded=true;flash=180;balls.push(makeBall(424,602,true),makeBall(476,602,true));balls[balls.length-2].vx=-4;balls[balls.length-2].vy=8;balls[balls.length-1].vx=4;balls[balls.length-1].vy=8;hud();tone(990,.3,'sawtooth',.04)}}
function updateBall(b){if(!b.active)return;if(b.cool>0)b.cool--;if(b.loopCooldown>0)b.loopCooldown--;
 if(b.looping){b.loopT+=1/72;const a=Math.PI/2-b.loopT*Math.PI*2;b.x=450+78*Math.cos(a);b.y=485+108*Math.sin(a);b.trail.push({x:b.x,y:b.y});if(b.trail.length>9)b.trail.shift();if(b.loopT>=1)finishLoop(b);return}
 b.trail.push({x:b.x,y:b.y});if(b.trail.length>9)b.trail.shift();b.vy+=.19;b.vx*=.999;b.vy*=.999;const speed=Math.hypot(b.vx,b.vy);if(speed>23){b.vx*=23/speed;b.vy*=23/speed}b.x+=b.vx;b.y+=b.vy;
 // A clear opening at the top of the plunger lane lets each launched ball merge into the table.
 if(b.lane&&b.y<285){b.lane=false;b.vx=-6.3;b.x=Math.min(b.x,741)}
 for(const r of rails){if(r[0]===745&&b.lane)continue;hitSegment(b,...r,.78,3)}
 for(const s of slings){if(hitSegment(b,...s,.9,5)&&b.cool<=0){b.vy-=2.2;award(25);b.cool=10;tone(390,.05,'triangle',.025)}}
 bumperHit(b);
 flippers.left.angle=flippers.left.pressed?-.66:-.08;flippers.right.angle=flippers.right.pressed?Math.PI+.66:Math.PI+.08;
 flipperHit(b,flippers.left,'left');flipperHit(b,flippers.right,'right');
 // The ramp entrance is a generous, visible capture zone; completed trips return the ball to the lower playfield.
 if(b.loopCooldown<=0&&b.vy>0&&b.y>565&&b.y<635&&Math.abs(b.x-450)<35)startLoop(b);
 if(b.y-b.r>980||b.x<55||b.x>845)b.active=false;
}
function ballCollision(a,b){if(!a.active||!b.active||a.looping||b.looping)return;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;if(d>=min||d<.001)return;const nx=dx/d,ny=dy/d,overlap=min-d;a.x-=nx*overlap*.5;a.y-=ny*overlap*.5;b.x+=nx*overlap*.5;b.y+=ny*overlap*.5;const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rel<0){const impulse=-rel*.9;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}}
function physics(){tick++;if(shake>0)shake*=.8;if(flash>0)flash--;if(keys.plunger&&state==='ready')charge=Math.min(48,charge+.8);snow.forEach(s=>{s.y+=s.s;s.x+=Math.sin(tick*.012+s.p)*.22;if(s.y>H+4){s.y=-4;s.x=Math.random()*W}});bumpers.forEach(p=>{if(p.cool>0)p.cool--});if(state!=='playing')return;
 for(const b of balls)updateBall(b);for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++)ballCollision(balls[i],balls[j]);balls=balls.filter(b=>b.active||state==='ready');
 if(!balls.some(b=>b.active)){lives--;hud();tone(120,.25,'sawtooth',.045);if(lives<=0){state='over';balls=[];startBtn.textContent='▶ Play again'}else serve()}else hud();}
function line(x1,y1,x2,y2,color,width){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke()}
function drawTree(){ctx.fillStyle='#704323';ctx.fillRect(435,500,30,68);for(let i=0;i<4;i++){const y=205+i*75,w=95+i*28;ctx.beginPath();ctx.moveTo(450,y);ctx.lineTo(450-w,y+140);ctx.lineTo(450+w,y+140);ctx.closePath();ctx.fillStyle=['#138547','#08733d','#15934d','#086936'][i];ctx.fill();ctx.strokeStyle='#7ed79a';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.moveTo(450-w*.68,y+95);ctx.quadraticCurveTo(450,y+125,450+w*.68,y+95);ctx.strokeStyle='#f7d15c';ctx.lineWidth=5;ctx.stroke();for(let j=0;j<4;j++){const ox=450-w*.55+j*w*.36,oy=y+70+(j%2)*35;ctx.beginPath();ctx.arc(ox,oy,7,0,Math.PI*2);ctx.fillStyle=['#f34b58','#f8df72','#8be8ff'][j%3];ctx.fill()}}ctx.fillStyle='#ffe876';ctx.font='42px serif';ctx.textAlign='center';ctx.fillText('★',450,207)}
function drawRamp(){ctx.save();ctx.shadowColor='#69e6ff';ctx.shadowBlur=15;ctx.lineWidth=15;ctx.strokeStyle='#a5c8d2';ctx.beginPath();ctx.ellipse(450,485,88,119,0,0,Math.PI*2);ctx.stroke();ctx.lineWidth=5;ctx.strokeStyle='#fff0a0';ctx.beginPath();ctx.ellipse(450,485,72,103,0,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#f8df72';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('🎢 LOOP RAMP · 500',450,355);ctx.restore()}
function drawBall(b){if(!b.active)return;b.trail.forEach((p,i)=>{ctx.globalAlpha=(i+1)/b.trail.length*.28;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,b.r*.7,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;const g=ctx.createRadialGradient(b.x-4,b.y-5,1,b.x,b.y,b.r);g.addColorStop(0,'#fff');g.addColorStop(1,'#9bb6cb');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0c583c');bg.addColorStop(.55,'#0a382a');bg.addColorStop(1,'#071c1c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(const s of snow){ctx.globalAlpha=.35+s.r*.15;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);ctx.fillStyle='#09271f';ctx.fillRect(85,75,730,825);drawTree();ctx.fillStyle='#081b1b';ctx.fillRect(748,80,67,820);
 for(const r of rails){line(...r,'#e9fbff',11);line(...r,'#d83a47',3)}
 // Ramp is drawn above the tree art as a raised pair of rails, with a bright entry and return chute.
 drawRamp();line(415,585,432,630,'#b7d5df',12);line(485,585,468,630,'#fff0a0',6);line(432,630,448,665,'#b7d5df',12);line(468,630,452,665,'#fff0a0',6);
 for(let i=0;i<19;i++){const x=102+i*38;for(const y of [83,895]){ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fillStyle=['#fb4a53','#ffe371','#75e9a1'][i%3];ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=12;ctx.fill()}}ctx.shadowBlur=0;
 slings.forEach(s=>{line(...s,'#ffe371',15);line(...s,'#d83a47',5)});
 bumpers.forEach((p,i)=>{const g=ctx.createRadialGradient(p.x,p.y,6,p.x,p.y,p.r+16);g.addColorStop(0,'#fff');g.addColorStop(.25,p.c);g.addColorStop(1,'#fff0');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r+16,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff1bc';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='white';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(['❄','★','❄','🎁','★'][i],p.x,p.y+7)});
 // Angled lower guides funnel the ball toward the two separated flippers, while leaving a drain gap between them.
 for(const side of ['left','right']){const f=flippers[side],ex=f.x+Math.cos(f.angle)*f.len,ey=f.y+Math.sin(f.angle)*f.len;line(f.x,f.y,ex,ey,'#fff5cf',29);line(f.x,f.y,ex,ey,f.pressed?'#ef4952':(side==='left'?'#d73c48':'#28a969'),8);ctx.beginPath();ctx.arc(f.x,f.y,14,0,Math.PI*2);ctx.fillStyle='#ffe27a';ctx.fill()}
 ctx.fillStyle='#94c9b8';ctx.fillRect(777,824,23,48);ctx.fillStyle='#ffdf75';ctx.fillRect(782,866-Math.min(charge,48)*.55,13,Math.max(4,charge*.55));for(const b of balls)drawBall(b);
 ctx.fillStyle='#ffe27a';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('3 LOOP RIDES = MULTIBALL',450,946);if(flash>0){ctx.fillStyle=`rgba(255,230,110,${Math.min(.9,flash/90)})`;ctx.font='bold 44px system-ui';ctx.fillText('🎉 MULTIBALL! 🎉',450,710)}ctx.restore();
 if(state!=='playing'){ctx.fillStyle='#00130fbd';ctx.fillRect(85,75,730,825);ctx.textAlign='center';ctx.fillStyle='#ffdf75';ctx.font='bold 52px system-ui';ctx.fillText(state==='title'?'🎄 CHRISTMAS PINBALL':state==='over'?'GAME OVER':'READY!',450,385);ctx.fillStyle='#fff';ctx.font='20px system-ui';ctx.fillText(state==='title'?'Candy-cane rails · sloped guides · loop ramp · multiball':state==='over'?`Final score: ${score} · tap Play again`:'Hold and release Space / Launch to serve',450,435);ctx.font='17px system-ui';ctx.fillStyle='#c8f4dc';ctx.fillText(state==='title'?'Press Start, then hold and release Space to launch':'A / ← and D / → work the separated flippers',450,478)}
}
let last=0,acc=0;function loop(now){acc+=Math.min(.05,(now-last)/1000||0);last=now;while(acc>=1/60){physics();acc-=1/60}draw();requestAnimationFrame(loop)}
function setFlipper(side,on){flippers[side].pressed=on;keys[side]=on}
function down(e){const k=e.key.toLowerCase();if([' ','arrowleft','arrowright'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')setFlipper('left',true);if(k==='arrowright'||k==='d')setFlipper('right',true);if(k===' '){keys.plunger=true;if(state==='title'||state==='over')newGame()}if(k==='r')newGame()}
function up(e){const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')setFlipper('left',false);if(k==='arrowright'||k==='d')setFlipper('right',false);if(k===' '){keys.plunger=false;if(state==='ready')launch()}}
function holdButton(el,side){el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}setFlipper(side,true)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>setFlipper(side,false))}
window.addEventListener('keydown',down);window.addEventListener('keyup',up);window.addEventListener('blur',()=>{setFlipper('left',false);setFlipper('right',false);keys.plunger=false});holdButton(document.querySelector('#left'),'left');holdButton(document.querySelector('#right'),'right');
startBtn.addEventListener('click',newGame);launchBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(state==='title'||state==='over')newGame();keys.plunger=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])launchBtn.addEventListener(ev,()=>{keys.plunger=false;if(state==='ready')launch()});soundBtn.addEventListener('click',()=>{muted=!muted;soundBtn.textContent=muted?'🔇 Sound off':'🔊 Sound on';if(!muted)tone(700,.08)});canvas.addEventListener('pointerdown',()=>{if(state==='title'||state==='over')newGame();else if(state==='ready')launch()});hud();requestAnimationFrame(loop);
})();
</script></body></html>
